<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' width='200' height='200'>
  <defs>
    <radialGradient id='bg' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e9'/>
      <stop offset='100%' stop-color='#f5e6c8'/>
    </radialGradient>
    <radialGradient id='coin1' cx='50%' cy='30%' r='50%'>
      <stop offset='0%' stop-color='#f6d27a'/>
      <stop offset='100%' stop-color='#cfa156'/>
    </radialGradient>
    <radialGradient id='coin2' cx='50%' cy='30%' r='50%'>
      <stop offset='0%' stop-color='#deb66c'/>
      <stop offset='100%' stop-color='#9e6938'/>
    </radialGradient>
  </defs>
  <rect width='200' height='200' rx='24' fill='url(#bg)'/>
  <!-- Coin stack back -->
  <ellipse cx='100' cy='145' rx='38' ry='11' fill='#b5872c' opacity='0.5'/>
  <rect x='62' y='100' width='76' height='45' rx='4' fill='url(#coin2)'/>
  <ellipse cx='100' cy='100' rx='38' ry='11' fill='url(#coin1)'/>
  <ellipse cx='100' cy='100' rx='28' ry='7' fill='#f6d27a' opacity='0.6'/>
  <!-- Coin middle -->
  <ellipse cx='100' cy='125' rx='38' ry='11' fill='#c79840' opacity='0.6'/>
  <rect x='62' y='82' width='76' height='43' rx='4' fill='url(#coin1)'/>
  <ellipse cx='100' cy='82' rx='38' ry='11' fill='#f6e09a'/>
  <ellipse cx='100' cy='82' rx='27' ry='7' fill='#fff6d0' opacity='0.5'/>
  <!-- Coin top -->
  <ellipse cx='100' cy='108' rx='38' ry='11' fill='#c79840' opacity='0.5'/>
  <rect x='62' y='64' width='76' height='44' rx='4' fill='url(#coin1)'/>
  <ellipse cx='100' cy='64' rx='38' ry='11' fill='#faecc2'/>
  <ellipse cx='100' cy='64' rx='26' ry='7' fill='#fff8e0' opacity='0.6'/>
  <!-- Price tag -->
  <rect x='118' y='40' width='54' height='38' rx='8' fill='#4e3524'/>
  <circle cx='127' cy='44' r='4' fill='#fff8e9' opacity='0.6'/>
  <text x='142' y='57' font-family='serif' font-size='12' font-weight='bold' fill='#f6d27a' text-anchor='middle'>Rp</text>
  <text x='142' y='70' font-family='sans-serif' font-size='9' fill='#ffe9b0' text-anchor='middle'>Terjangkau</text>
  <!-- Sparkles -->
  <text x='52' y='52' font-size='18' fill='#cfa156' opacity='0.8'>✦</text>
  <text x='152' y='100' font-size='12' fill='#9e6938' opacity='0.6'>✦</text>
  <text x='40' y='130' font-size='10' fill='#cfa156' opacity='0.5'>✦</text>
